name: NoteEnv
channels:
  - defaults
dependencies:
  - python
  - pip
  - ipykernel
  - jupyterlab
  - pip:
    - certifi
    - cffi
    - charset-normalizer
    - colorama
    - cycler
    - ecg-plot
    - filelock
    - h5py
    - idna
    - Jinja2
    - kiwisolver
    - MarkupSafe
    - matplotlib
    - mpmath
    - networkx
    - numpy
    - pandas
    - Pillow
    - pycparser
    - pyparsing
    - python-dateutil
    - pytz
    - requests
    - scipy
    - six
    - soundfile
    - sympy
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch
    - torchvision
    - scikit-learn
    - tqdm
    - ipywidgets
    - typing_extensions
    - tzdata
    - urllib3
    - wfdb
    - xmljson
    

name: NoteEnv
channels:
  - defaults
dependencies:
  - python >=3.10,<3.12 #=3.9
  - pip:
    - certifi
    - cffi
    - charset-normalizer
    - colorama
    - cycler
    - ecg-plot
    - filelock
    - h5py
    - idna
    - Jinja2
    - kiwisolver
    - MarkupSafe
    - matplotlib
    - mpmath
    - networkx
    - numpy
    - pandas
    - Pillow
    - pycparser
    - pyparsing
    - python-dateutil
    - pytz
    - requests
    - scipy
    - six
    - soundfile
    - sympy
    - torch
    - torchvision
    - tqdm
    - typing_extensions
    - tzdata
    - urllib3
    - wfdb
    - xmljson
